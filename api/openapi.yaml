components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: hub-session
      description: hub が発行する短期アクセストークン
    refreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: hub-refresh
      description: hub が発行する更新トークン（ローテーション付き）
    githubOAuth:
      type: oauth2
      description: |
        認可コード + PKCE。クライアントは認可 URL へリダイレクトされるだけで、
        トークン交換は hub API 側で行う。スコープは read:user と公開用リポジトリの
        作成・更新に必要な最小限。
      flows:
        authorizationCode:
          authorizationUrl: https://github.com/login/oauth/authorize
          tokenUrl: https://github.com/login/oauth/access_token
          scopes:
            read:user: 公開プロフィールの読み取り
            public_repo: 公開リポジトリの作成・更新（公開用の保管単位のため）
            repo: 非公開リポジトリの作成・更新（非公開公開を選んだ場合のみ）
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    NumberParam:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: 前ページの nextCursor（省略時は先頭）
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 読み取り時の etag。版が進んでいた場合は 409
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 作成系の重複防止キー（24 時間有効）
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    ValidationFailed:
      description: 入力値が契約に違反している
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/validation_failed
            title: 入力内容に誤りがあります
            status: 400
            detail: ライセンスが指定されていません
            code: validation_failed
            traceId: 01J0000000000000000000000000
    AuthenticationRequired:
      description: 未認証またはセッション不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/authentication_required
            title: サインインが必要です
            status: 401
            code: authentication_required
            traceId: 01J0000000000000000000000000
    SessionExpired:
      description: セッション期限切れまたは失効
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/session_expired
            title: セッションの有効期限が切れました
            status: 401
            code: session_expired
            traceId: 01J0000000000000000000000000
    PermissionDenied:
      description: 操作権限がない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/permission_denied
            title: この操作を行う権限がありません
            status: 403
            code: permission_denied
            traceId: 01J0000000000000000000000000
    NotFound:
      description: 対象が存在しない、または存在を秘匿すべき場合
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/not_found
            title: 見つかりませんでした
            status: 404
            code: not_found
            traceId: 01J0000000000000000000000000
    Conflict:
      description: 楽観ロック不一致または状態競合
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/conflict
            title: データが更新されています。再読み込みしてください
            status: 409
            code: conflict
            traceId: 01J0000000000000000000000000
    PayloadTooLarge:
      description: アップロードサイズ超過
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/payload_too_large
            title: アップロードが上限を超えています
            status: 413
            code: payload_too_large
            traceId: 01J0000000000000000000000000
    RateLimited:
      description: レートリミット超過
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/rate_limited
            title: リクエストが多すぎます
            status: 429
            code: rate_limited
            retryAfterSeconds: 30
            traceId: 01J0000000000000000000000000
    UpstreamUnavailable:
      description: 外部基盤の障害またはタイムアウト
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://novnow.hub/problems/upstream_unavailable
            title: 外部サービスが一時的に利用できません
            status: 503
            code: upstream_unavailable
            traceId: 01J0000000000000000000000000
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code:
          type: string
          enum:
            - validation_failed
            - authentication_required
            - session_expired
            - refresh_token_reused
            - permission_denied
            - not_found
            - conflict
            - idempotency_mismatch
            - payload_too_large
            - rate_limited
            - upstream_unavailable
            - verification_failed
            - job_not_found
            - internal_error
        retryAfterSeconds: { type: integer, minimum: 1 }
        traceId: { type: string }
    Meta:
      type: object
      required: [contractVersion, serverTime]
      properties:
        contractVersion: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        serverTime: { type: string, format: date-time }
        minimumClientVersion: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 'アクセストークンの残り秒数' }
    User:
      type: object
      required: [id, handle, displayName, createdAt]
      properties:
        id: { type: string }
        handle: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri }
        bio: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        etag: { type: string }
    PublicUser:
      type: object
      required: [id, handle, displayName, createdAt]
      properties:
        id: { type: string }
        handle: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        bio: { type: string, maxLength: 500 }
        publishedProjectCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    PublicUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicUser' }
        nextCursor: { type: [string, 'null'] }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri }
        bio: { type: string, maxLength: 500 }
    Project:
      type: object
      required: [id, slug, title, ownerHandle, license, visibility, derivativePolicy, derivativeCount, defaultBranchName, etag, createdAt, updatedAt, publishedUrl]
      properties:
        id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,80}[a-z0-9])?$' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        ownerHandle: { type: string }
        license:
          type: string
          enum: [cc0, cc-by, cc-by-sa, cc-by-nc, custom]
        visibility:
          type: string
          enum: [public, private]
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 10
        derivativePolicy:
          type: string
          enum: [allowed, allowed-with-conditions, disallowed]
        derivativeCount: { type: integer, minimum: 0 }
        defaultBranchName: { type: string }
        etag: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedUrl: { type: string, format: uri }
    ProjectUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        license: { type: string, enum: [cc0, cc-by, cc-by-sa, cc-by-nc, custom] }
        visibility: { type: string, enum: [public, private] }
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 10
        derivativePolicy:
          type: string
          enum: [allowed, allowed-with-conditions, disallowed]
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextCursor: { type: [string, 'null'] }
    DerivativeNode:
      type: object
      required: [id, slug, title, ownerHandle, depth, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        ownerHandle: { type: string }
        depth: { type: integer, minimum: 1 }
        parentId: { type: [string, 'null'] }
        derivativePolicy:
          type: string
          enum: [allowed, allowed-with-conditions, disallowed]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Tree:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [path, kind, size]
            properties:
              path: { type: string }
              kind: { type: string, enum: [file, dir] }
              size: { type: integer, minimum: 0 }
              etag: { type: string }
        truncated: { type: boolean }
    FileContent:
      type: object
      required: [path, etag, encoding]
      properties:
        path: { type: string }
        content: { type: string, description: 'encoding=utf8 のとき必須' }
        data: { type: string, description: 'encoding=base64 のとき必須' }
        mime: { type: string, description: 'encoding=base64 のときの MIME 型' }
        encoding: { type: string, enum: [utf8, base64] }
        etag: { type: string }
        size: { type: integer, minimum: 0 }
    FileMeta:
      type: object
      required: [path, etag, size]
      properties:
        path: { type: string }
        etag: { type: string }
        size: { type: integer, minimum: 0 }
        commitId: { type: string }
    CommitResult:
      type: object
      required: [commitId, changes]
      properties:
        commitId: { type: string }
        message: { type: string }
        changes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    Release:
      type: object
      required: [tag, name, createdAt]
      properties:
        tag: { type: string }
        name: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
    Proposal:
      type: object
      required: [number, title, body, state, authorHandle, baseRef, headRef, diffStats, checks, approvalCount, requiredApprovals, createdAt, updatedAt]
      properties:
        number: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, approved, merged, closed] }
        authorHandle: { type: string }
        baseRef: { type: string }
        headRef: { type: string }
        diffStats:
          type: object
          required: [additions, deletions, changedFiles]
          properties:
            additions: { type: integer, minimum: 0 }
            deletions: { type: integer, minimum: 0 }
            changedFiles: { type: integer, minimum: 0 }
        checks:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { type: string }
              state: { type: string, enum: [pending, success, failure, neutral, skipped] }
              detailsUrl: { type: string, format: uri }
        approvalCount: { type: integer, minimum: 0 }
        requiredApprovals: { type: integer, minimum: 0 }
        automerge:
          $ref: '#/components/schemas/AutomergeState'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProposalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        nextCursor: { type: [string, 'null'] }
    ProposalDiff:
      type: object
      required: [number, files]
      properties:
        number: { type: integer, minimum: 1 }
        files:
          type: array
          items:
            type: object
            required: [path, status, hunks]
            properties:
              path: { type: string }
              status: { type: string, enum: [added, modified, deleted, renamed] }
              additions: { type: integer, minimum: 0 }
              deletions: { type: integer, minimum: 0 }
              hunks:
                type: array
                items: { type: string }
        novnowDiagnosticsDelta:
          type: object
          required: [introduced, resolved]
          properties:
            introduced: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
    Comment:
      type: object
      required: [id, authorHandle, body, createdAt]
      properties:
        id: { type: string }
        authorHandle: { type: string }
        body: { type: string }
        path: { type: string }
        line: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
    MergeResult:
      type: object
      required: [merged, sha]
      properties:
        merged: { type: boolean }
        sha: { type: string }
        mergedAt: { type: string, format: date-time }
    AutomergeState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [none, reserved, armed, merged, failed, canceled] }
        requiredApprovals: { type: integer, minimum: 0 }
        requiredChecks:
          type: array
          items: { type: string }
        requireNoConflicts: { type: boolean }
        reason: { type: string, description: 'failed のときの理由' }
    Issue:
      type: object
      required: [number, title, body, state, authorHandle, createdAt, updatedAt]
      properties:
        number: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        labels:
          type: array
          items: { type: string }
        authorHandle: { type: string }
        assigneeHandle: { type: [string, 'null'] }
        linkedProposalNumber: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IssueUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        labels:
          type: array
          items: { type: string }
          maxItems: 10
        assigneeHandle: { type: [string, 'null'] }
        state: { type: string, enum: [open, closed] }
    IssuePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: [string, 'null'] }
    ChatChannel:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 200 }
        unreadCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, channelId, authorHandle, body, deleted, createdAt]
      properties:
        id: { type: string }
        channelId: { type: string }
        authorHandle: { type: string }
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions:
          type: array
          items: { type: string }
        editedAt: { type: [string, 'null'], format: date-time }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
    ChatMessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        nextCursor: { type: [string, 'null'] }
    Notification:
      type: object
      required: [id, kind, title, body, read, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum:
            - derivative_created
            - proposal_merged
            - proposal_automerge_failed
            - proposal_comment
            - issue_created
            - issue_comment
            - mention
            - job_finished
            - publish_rebuilt
        projectId: { type: [string, 'null'] }
        projectSlug: { type: [string, 'null'] }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: [string, 'null'] }
    NotificationSetting:
      type: object
      required: [kind, channel, enabled]
      properties:
        kind:
          type: string
          enum:
            - derivative_created
            - proposal_merged
            - proposal_automerge_failed
            - proposal_comment
            - issue_created
            - issue_comment
            - mention
            - job_finished
            - publish_rebuilt
        channel: { type: string, enum: [in_app, email, web_push] }
        enabled: { type: boolean }
    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [pending, running] }
    Job:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [verify, diagnostics, export] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        result: { type: [object, 'null'], description: 'kind ごとの結果（成功時）' }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    VerificationResult:
      type: object
      required: [ok, checkedAt]
      properties:
        ok: { type: boolean }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
        checkedAt: { type: string, format: date-time }
    ReadingDocument:
      type: object
      required: [projectId, title, blocks, etag]
      properties:
        projectId: { type: string }
        title: { type: string }
        blocks:
          type: array
          items:
            type: object
            required: [kind, text]
            properties:
              kind: { type: string, enum: [heading, paragraph, dialogue, scene_break] }
              text: { type: string }
              speaker: { type: [string, 'null'] }
        etag: { type: string }
    SetupInfo:
      type: object
      required: [projectId, slug, snapshotVersion, acquisition, novnow]
      properties:
        projectId: { type: string }
        slug: { type: string }
        snapshotVersion: { type: string }
        acquisition:
          type: object
          required: [kind, url]
          properties:
            kind: { type: string, enum: [codeload, git] }
            url: { type: string, format: uri }
            ref: { type: string }
        novnow:
          type: object
          required: [minVersion]
          properties:
            minVersion: { type: string }
    Derivation:
      type: object
      required: [id, parentId, childId, depth, createdAt]
      properties:
        id: { type: string }
        parentId: { type: string }
        childId: { type: string }
        depth: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
