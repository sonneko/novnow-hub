openapi: 3.1.0
info:
  title: novnow-hub API
  version: 1.0.0
  description: |
    novnow-hub の REST/JSON API 契約。クライアント（Web / Tauri）はこの契約だけに依存する。

    設計上の重要事項:
    - 本契約には GitHub 等の外部基盤の概念を持ち込まない（認証が GitHub OAuth である点を除く）。
    - エラーは RFC 9457（Problem Details）形式で返し、機械可読な `code` で分岐する。
    - 一覧系はカーソル方式のページネーションで、総件数は返さない。
    - 作成系は `Idempotency-Key` を受け付け、更新系は `If-Match` による楽観ロックを用いる。
  contact:
    name: novnow-hub maintainers
    url: https://github.com/sonneko/novnow-hub
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://hub.novnow.example.com/api/v1
    description: 公開インスタンス（例）
  - url: http://localhost:4010/api/v1
    description: ローカルモックサーバー（開発用）
tags:
  - name: meta
    description: 契約の版情報とヘルスチェック
  - name: auth
    description: GitHub OAuth によるサインイン・セッション管理
  - name: users
    description: 利用者像の取得・更新
  - name: projects
    description: 公開プロジェクトの作成・取得・更新・派生
  - name: contents
    description: プロジェクト内ファイルのツリーと内容
  - name: proposals
    description: 変更提案（親作品への取り込み単位）
  - name: automerge
    description: 条件付き自動取り込みの予約
  - name: issues
    description: 課題の作成・更新・会話
  - name: chat
    description: プロジェクト付随のチャット
  - name: search
    description: 公開プロジェクトと利用者の検索
  - name: notifications
    description: 通知センターと通知設定
  - name: novnow
    description: novnow 形式に特化した検証・診断・エクスポート
  - name: setup
    description: novnow アプリ向けのセットアップ解決
security:
  - bearerAuth: []
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: 契約の版情報とサーバ時刻
      security: []
      responses:
        '200':
          description: 契約の版情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /auth/github/start:
    get:
      operationId: authGitHubStart
      tags: [auth]
      summary: GitHub OAuth の認可 URL を発行する
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: 認可後に戻すクライアント側 URL（許可リスト検査あり）
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: 認可 URL へのリダイレクト
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/github/callback:
    get:
      operationId: authGitHubCallback
      tags: [auth]
      summary: OAuth コールバックを処理しセッションを発行する
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: クライアントのコールバック URL へ一時コードを付けてリダイレクト
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: 更新トークンをローテーションしてアクセストークンを更新する
      security:
        - refreshTokenAuth: []
      responses:
        '200':
          description: 新しいトークン対
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: セッション期限切れ・失効、または更新トークン再利用検知（再利用時は当該利用者の全セッションを失効）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sessionExpired:
                  value:
                    type: https://novnow.hub/problems/session_expired
                    title: セッションの有効期限が切れました
                    status: 401
                    code: session_expired
                    traceId: 01J0000000000000000000000000
                refreshTokenReused:
                  value:
                    type: https://novnow.hub/problems/refresh_token_reused
                    title: セッションが無効になりました
                    status: 401
                    code: refresh_token_reused
                    traceId: 01J0000000000000000000000000
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: 当該セッションを失効させる
      responses:
        '204':
          description: 失効完了
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/account:
    delete:
      operationId: authDeleteAccount
      tags: [auth]
      summary: 退会（個人情報の削除と全セッション失効。作品は GitHub 上に残る）
      responses:
        '204':
          description: 退会完了
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: 自分の利用者像を取得する
      responses:
        '200':
          description: 利用者像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
    patch:
      operationId: updateMe
      tags: [users]
      summary: 表示名・アイコン・通知設定を更新する
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新後の利用者像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /users/{handle}:
    get:
      operationId: getUserByHandle
      tags: [users]
      summary: 公開利用者像を取得する
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$'
      responses:
        '200':
          description: 公開利用者像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/projects:
    get:
      operationId: listMyProjects
      tags: [projects]
      summary: 自分のプロジェクト一覧（非公開含む）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: プロジェクト一覧ページ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 公開プロジェクトの一覧
      security: []
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated, created, derivatives]
            default: updated
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: プロジェクト一覧ページ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
    post:
      operationId: createProject
      tags: [projects]
      summary: 新規公開（zip 取込または既存ソース指定）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, license, archive]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                license:
                  type: string
                  enum: [cc0, cc-by, cc-by-sa, cc-by-nc, custom]
                visibility:
                  type: string
                  enum: [public, private]
                  default: public
                archive:
                  type: string
                  format: binary
                  description: novnow プロジェクトの zip（50MB まで）
          application/json:
            schema:
              type: object
              required: [title, license, source]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                license:
                  type: string
                  enum: [cc0, cc-by, cc-by-sa, cc-by-nc, custom]
                visibility:
                  type: string
                  enum: [public, private]
                  default: public
                source:
                  type: object
                  required: [kind, url]
                  description: 外部から取得するアーカイブの場所（保管基盤の種別は指定しない）
                  properties:
                    kind: { type: string, enum: [archive_url] }
                    url: { type: string, format: uri, description: 'zip のダウンロード URL（hub が取得する）' }
      responses:
        '201':
          description: 作成されたプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: novnow 形式の検証失敗
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [projects]
      summary: プロジェクト詳細（公開ページ用）
      security: []
      responses:
        '200':
          description: プロジェクト詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      tags: [projects]
      summary: タイトル・説明・タグ・公開範囲・ライセンスを更新する
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: 更新後のプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: 公開の取り下げ（保管単位は削除しない）
      responses:
        '204':
          description: 取り下げ完了
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}/derivatives:
    get:
      operationId: listDerivatives
      tags: [projects]
      summary: 派生ツリー（子・孫・兄弟）を取得する
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 派生ツリー
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DerivativeNode'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/derive:
    post:
      operationId: deriveProject
      tags: [projects]
      summary: 派生作品を作成する（非同期）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                visibility:
                  type: string
                  enum: [public, private]
                  default: private
      responses:
        '202':
          description: 派生作成を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/releases:
    post:
      operationId: createRelease
      tags: [projects]
      summary: リリース（版）を作成する
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, name]
              properties:
                tag: { type: string, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$' }
                name: { type: string, minLength: 1, maxLength: 120 }
                notes: { type: string, maxLength: 10000 }
      responses:
        '201':
          description: 作成されたリリース
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}/tree:
    get:
      operationId: getTree
      tags: [contents]
      summary: ファイルツリーを取得する
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: ファイルツリー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/file:
    get:
      operationId: getFile
      tags: [contents]
      summary: ファイル内容を取得する
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: ファイル内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putFile
      tags: [contents]
      summary: ファイルを作成・更新する（楽観ロック）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string, maxLength: 1024 }
                content: { type: string }
                message: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新後のファイルメタ情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}/commit:
    post:
      operationId: commitFiles
      tags: [contents]
      summary: 複数ファイルの原子的コミット
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, changes]
              properties:
                message: { type: string, minLength: 1, maxLength: 200 }
                changes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [path, action]
                    properties:
                      path: { type: string, maxLength: 1024 }
                      action: { type: string, enum: [create, update, delete] }
                      content: { type: string, description: 'create/update のとき必須' }
      responses:
        '200':
          description: コミット結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}/proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: 変更提案の一覧
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: state
          in: query
          schema:
            type: string
            enum: [open, approved, merged, closed]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 変更提案のページ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: openProposal
      tags: [proposals]
      summary: 変更提案を作成する
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, headRef, baseRef]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 10000 }
                headRef: { type: string, minLength: 1, maxLength: 255 }
                baseRef: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: 作成された変更提案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /projects/{projectId}/proposals/{number}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: 変更提案の詳細
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
      responses:
        '200':
          description: 変更提案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/proposals/{number}/diff:
    get:
      operationId: getProposalDiff
      tags: [proposals]
      summary: 変更提案の差分（novnow 診断差分を含む）
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
      responses:
        '200':
          description: 差分
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalDiff'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/proposals/{number}/comments:
    get:
      operationId: listProposalComments
      tags: [proposals]
      summary: 変更提案のコメント一覧
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: コメントのページ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: commentProposal
      tags: [proposals]
      summary: 変更提案へコメントする
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                path: { type: string, description: 'インラインコメントの対象ファイル' }
                line: { type: integer, minimum: 1 }
      responses:
        '201':
          description: 作成されたコメント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/proposals/{number}/approve:
    post:
      operationId: reviewProposal
      tags: [proposals]
      summary: 承認／承認取消し／却下を記録する
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [approve, dismiss, request_changes]
                body: { type: string, maxLength: 10000 }
      responses:
        '200':
          description: レビュー記録後の変更提案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/proposals/{number}/merge:
    post:
      operationId: mergeProposal
      tags: [proposals]
      summary: 変更提案を即時取り込む
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NumberParam'
      responses:
        '200':
          description: 取り込み結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
