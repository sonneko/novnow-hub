name: CI

# 継続的検証ワークフロー。
#
# ジョブ構成:
# 1. `docs`: ドキュメント管理規則の検証 + 変更ファイルの判定（docs-only の場合は重いジョブをスキップ）
# 2. `rust`: バックエンド（Rust / Axum）の build・test・clippy
# 3. `lint`: Astro / Svelte / TypeScript の型チェック（Vitest によるテストも `npm run check` に含めて実行）
# 4. `test`: テストの実行（テスト自体は lint ジョブの `npm run check` で実行しているため、本書は位置付けのみ）
# 5. `build`: フロントエンドのビルド検証
#
# PR の draft 中はジョブをスキップし、ready for review で走らせる。
# PR の push では古い実行をキャンセルする。

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_SHA: ${{ github.sha }}
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  docs:
    name: Docs & Change Filter
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify documentation rules (verify-docs.py)
        run: python3 docs/script/verify-docs.py

      - name: Validate OpenAPI contract (api/openapi.yaml)
        run: |
          python3 -m pip install --quiet openapi-spec-validator pyyaml
          python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml', encoding='utf-8'))); print('openapi.yaml: OK')"
          # 契約に GitHub 固有語が混入していないか検査（認証記述は除く）
          if grep -nE 'octokit|pull_request|pull-request|installation_id|/repos/|repository_dispatch' api/openapi.yaml; then
            echo "::error::api/openapi.yaml に GitHub 固有語が含まれています（契約は hub 語彙に統一してください）"
            exit 1
          fi

      - name: Smoke test Prism mock
        working-directory: web
        run: bash ../docs/script/smoke-mock.sh

      - name: Detect whether code inputs changed
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/developers.md|docs/plans.md|docs/handoff.md|docs/history.md|docs/designs/*|docs/specifications/*|docs/script/*|api/*|README.md|LICENSE|.github/workflows/*)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (backend)
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.toml', 'server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (cargo build)
        working-directory: server
        run: cargo build --locked --all-targets

      - name: Test (cargo test)
        working-directory: server
        run: cargo test --locked --all-targets

      - name: Lint (cargo clippy)
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings

  lint:
    name: Type Check
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro, Svelte and TypeScript
        run: npm run check

  test:
    name: Test
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # テスト実行自体は lint ジョブの `npm run check`（Vitest を含む）で担っているため、本ジョブは構成上の位置付けのみとする。
      - name: Note on test execution
        run: echo "Tests run via the lint job's 'npm run check' (Vitest)."

  build:
    name: Build Check
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tauri は最小シェルのみ。このジョブは読み込み元となる web/dist の生成を検証する。
      - name: Build frontend
        run: npm run build
