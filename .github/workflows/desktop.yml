name: Desktop (Tauri)

# novnow-hub デスクトップアプリ（Tauri v2）のビルド・配布パイプライン。
#
# Linux 向けビルドを ubuntu-latest で実行し、ビルド成果物（インストーラ）を
# アーティファクトとして配布する。Windows／macOS 向けは各ランナーで同様にビルド
# 可能（ランナーの OS に合わせてビルド対象が切り替わる）。
#
# 署名（インストーラ署名）は M7 で対応。方式は「Tauri ネイティブ bundle 署名」を
# 採用し、署名設定は `--config` で条件付き注入する。署名用の証明書・秘密情報は
# GitHub Actions secrets から参照し、**secrets が未設定のときは unsigned（未署名）
# フォールバック**でビルドする（PR ビルドが緑になること）。署名の有効化は各プラット
# フォームの secrets を設定するだけで、設定の有無で自動的に切り替わる。
# 証明書の発行・登録手順（sonneko のみ実施可能）は docs/handoff.md に明記する。
# Linux には標準的なインストーラ署名機関が無く、Phase 1 は未署名配布とする
# （任意の AppImage GPG 署名は docs/handoff.md に手順として記録）。

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  TAURI_CLI_NO_UPDATE: "1"

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux system dependencies (webkit2gtk etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file \
            wget

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build desktop app (Tauri, unsigned)
        working-directory: web
        run: |
          set +e
          npm run tauri -- build --bundles > /tmp/tauri-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::tauri build failed (exit $status). Non-progress log tail:"
            tail -n 120 /tmp/tauri-build.log |
              grep -v -E 'Compiling|Downloaded|Downloading|Finished|Updating|Adding|Locking|Blocking|Installed|Removed|Compiling' |
              grep -v '^[[:space:]]*$' |
              while IFS= read -r line; do
                chunk="${line:0:1000}"
                echo "::error::$chunk"
              done
            exit "$status"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novnow-hub-linux
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/novnow-hub
          retention-days: 14

  # Windows／macOS 向けはランナーを切り替えて同様にビルドする。
  # webkit 等のシステム依存がないため、追加の apt インストールは不要。
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Windows 署名（signtool）用の secrets。未設定なら unsigned。
      WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Prepare Windows signing config
        # 証明書 thumbprint が設定されているときだけ、pfx をローカルの証明書ストアに
        # 登録し署名設定を注入する。未設定（PR ビルド等）は unsigned にフォールバック。
        if: env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:TEMP "novnow-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_FILE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -Password $secure -CertStoreLocation Cert:\LocalMachine\My
          $signing = [ordered]@{
            bundle = [ordered]@{
              windows = [ordered]@{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
              }
            }
          }
          $signing | ConvertTo-Json -Depth 5 | Set-Content "$env:GITHUB_WORKSPACE\src-tauri\tauri.signing.json"
          Write-Host "Windows signing configured for thumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT"

      - name: Build desktop app (Tauri)
        working-directory: web
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "tauri-build.log"
          $tauriArgs = @("build", "--bundles")
          if (Test-Path "$env:GITHUB_WORKSPACE\src-tauri\tauri.signing.json") {
            $tauriArgs += @("--config", "$env:GITHUB_WORKSPACE\src-tauri\tauri.signing.json")
          }
          npm run tauri -- @tauriArgs *> $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host "::error::tauri build failed (exit $status). Non-progress log tail:"
            $lines = Get-Content $log -Tail 120
            $progress = 'Compiling|Downloaded|Downloading|Finished|Updating|Adding|Locking|Blocking|Installed|Removed'
            foreach ($line in $lines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -match $progress) { continue }
              $chunk = $line.Substring(0, [Math]::Min(1000, $line.Length))
              Write-Host "::error::$chunk"
            }
            exit $status
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novnow-hub-windows
          path: src-tauri/target/release/bundle/
          retention-days: 14

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # macOS 署名（codesign + ノタリゼーション）用の secrets。未設定なら unsigned。
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Prepare macOS signing config
        # 署名 identity が設定されているときだけ署名設定を注入する。
        # 未設定（PR ビルド等）は設定ファイルを作らず unsigned にフォールバックする。
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: |
          # 配布用署名証明書（p12）をランナーの keychain に導入する（任意）。
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/novnow-cert.p12
            security import /tmp/novnow-cert.p12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          fi
          cat > "$GITHUB_WORKSPACE/src-tauri/tauri.signing.json" <<EOF
          {
            "bundle": {
              "macOS": {
                "signingIdentity": "$MACOS_SIGNING_IDENTITY",
                "hardenedRuntime": true
              }
            }
          }
          EOF
          echo "macOS signing configured: $MACOS_SIGNING_IDENTITY"

      - name: Build desktop app (Tauri)
        working-directory: web
        run: |
          set +e
          CONFIG_ARG=""
          if [ -f "$GITHUB_WORKSPACE/src-tauri/tauri.signing.json" ]; then
            CONFIG_ARG="--config $GITHUB_WORKSPACE/src-tauri/tauri.signing.json"
            # ノタリゼーションは 3 つの Apple 資格が揃っていれば有効化する。
            # 未設定/一部欠如は codesign のみ行い、ノタリゼーションはスキップする。
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              export APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          fi
          npm run tauri -- build --bundles $CONFIG_ARG > /tmp/tauri-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::tauri build failed (exit $status). Non-progress log tail:"
            tail -n 120 /tmp/tauri-build.log |
              grep -v -E 'Compiling|Downloaded|Downloading|Finished|Updating|Adding|Locking|Blocking|Installed|Removed|Compiling' |
              grep -v '^[[:space:]]*$' |
              while IFS= read -r line; do
                chunk="${line:0:1000}"
                echo "::error::$chunk"
              done
            exit "$status"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novnow-hub-macos
          path: src-tauri/target/release/bundle/
          retention-days: 14
