name: Cargo Lock

# src-tauri の Cargo.lock を生成・更新し、PR 分支にコミットする（再現性のため）。
#
# Arena サンドボックスは crates.io へ到達不可で、新規依存（keyring / aes-gcm /
# sha2 / getrandom / tauri）が vendored-sources に未収録のため、Cargo.lock を
# ローカルで生成できない。CI ランナーは crates.io へ直結できるため、ここで
# `cargo generate-lockfile` を実行し、生成された Cargo.lock を GitHub Contents
# API で PR 分支へ直接コミットする（git push を使わないため detached HEAD や
# push 権限・キャンセル競合の影響を受けない）。既存依存の不必要な全体更新は
# 行わず、現在の Cargo.toml の解決結果のみをロックする。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit Cargo.lock via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lock=src-tauri/Cargo.lock
          if [ ! -f "$lock" ]; then
            echo "::error::cargo generate-lockfile did not create $lock"
            exit 1
          fi
          size=$(wc -c < "$lock")
          echo "Generated $lock ($size bytes)"

          # pull_request イベントでは GITHUB_REF_NAME は PR 番号（例: "55"）であり
          # ブランチ名ではない。ソースブランチ名は GITHUB_HEAD_REF から取得する。
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          repo="${GITHUB_REPOSITORY}"
          content=$(base64 -w0 "$lock")

          # 既存の Cargo.lock がある場合は現在の sha を取得（新規なら空）。
          existing_sha=$(gh api "repos/${repo}/contents/${lock}?ref=${branch}" \
            --jq '.sha' 2>/dev/null || echo "")

          args=(-X PUT "repos/${repo}/contents/${lock}"
            -f "message=chore: update Cargo.lock"
            -f "content=${content}"
            -f "branch=${branch}")
          if [ -n "$existing_sha" ]; then
            args+=(-f "sha=${existing_sha}")
          fi
          if ! gh api "${args[@]}" >/dev/null; then
            echo "::error::Failed to commit Cargo.lock via Contents API (branch=$branch)"
            gh api "repos/${repo}/contents/${lock}?ref=${branch}" --jq '.sha' >&2 || true
            exit 1
          fi
          echo "Committed $lock to $branch via Contents API"
