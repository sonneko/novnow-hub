name: Cargo Lock

# src-tauri の Cargo.lock を生成・更新し、PR 分支にコミットする（再現性のため）。
#
# Arena サンドボックスは crates.io へ到達不可で、新規依存（keyring / aes-gcm /
# sha2 / getrandom / tauri）が vendored-sources に未収録のため、Cargo.lock を
# ローカルで生成できない。CI ランナーは crates.io へ直結できるため、ここで
# `cargo generate-lockfile` を実行し、生成された Cargo.lock を PR 分支へコミットする。
# 既存の依存バージョンの不必要な全体更新は行わず、現在の Cargo.toml の解決結果
# のみをロックする。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        run: |
          set -euo pipefail
          lock=src-tauri/Cargo.lock
          if [ ! -f "$lock" ]; then
            echo "::error::cargo generate-lockfile did not create $lock"
            exit 1
          fi
          size=$(wc -c < "$lock")
          echo "Generated $lock ($size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$lock"
          # 未追跡（新規生成）または内容変更のときのみコミット。変化なければスキップ。
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Cargo.lock"
            # pull_request イベントでは actions/checkout が detached HEAD で
            # 検出されるため、ブランチへ明示的に参照を突っ込む。
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            echo "Committed $lock" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$lock is up to date (no changes)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
