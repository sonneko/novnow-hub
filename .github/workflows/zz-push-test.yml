name: zz-push-test

# 一時的な診断ワークフロー: git の orphan push 機構そのものを検証する。
# 本番の toolchain-export から分離して、Push 失敗の原因を切り分ける。

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  push-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test orphan push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/export
          cd /tmp/export
          rm -rf testrepo .git
          git init -q testrepo
          cd testrepo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -qb cache/rust-toolchain
          echo "diagnostic content" > content.txt
          git add -A
          git commit -qm "diagnostic push test"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          {
            git push --force origin cache/rust-toolchain
          } > /tmp/push.log 2>&1
          rc=$?
          echo "push rc=$rc"
          cat /tmp/push.log
          if [ "$rc" != "0" ]; then
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "zz-push-test: orphan push 失敗 (run $GITHUB_RUN_ID)" \
              --body "```\n$(cat /tmp/push.log)\n```" || echo "issue create failed"
            exit "$rc"
          fi
          echo "orphan push OK"
