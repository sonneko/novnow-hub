# VPS + Docker 構成の nginx 逆プロキシ設定（M7 §2.1）。
#
# 公開ドメイン（プレースホルダ）を nginx で受け、hub サーバー（8080）へ逆プロキシする。
# TLS 証明書はアカウント側で取得・設定（Let's Encrypt 等）。証明書ファイルは
# リポジトリに載せない。

server {
    listen 80;
    server_name novnow.example.com;   # プレースホルダ（実際のドメインを設定）

    # HTTP は HTTPS へリダイレクト。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name novnow.example.com;   # プレースホルダ（実際のドメインを設定）

    # TLS 証明書（アカウント側で取得・配置。リポジトリに載せない）。
    ssl_certificate     /etc/nginx/certs/novnow.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/novnow.example.com.key;

    # セキュリティヘッダ（CSP 等の基本策定）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hub API（/api/ 配下）をサーバーへ逆プロキシ。
    location /api/ {
        proxy_pass http://hub:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 内部 Webhook 受信口（/internal/ 配下）もサーバーへ逆プロキシ。
    location /internal/ {
        proxy_pass http://hub:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公開ページ（静的）は nginx が直接配信。
    location / {
        proxy_pass http://hub:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
