[package]
name = "novnow-hub"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# セッション情報の保存。主backは OS キーチェーン（macOS Keychain / Windows
# Credential Manager / Linux Secret Service）で、keyring v3 を使用する。
# M6 では「コンパイル失敗」として排除したが、当時の失敗は実際には CLI 引数エラー
# （`--bundle`）と `tauri::State` の lifetime 欠落（E0726）であり、依存クレートの
# コンパイル可否は未検証だった。本次（M7）で keyring v3 の API をソースで確定し
# 再挑戦する。使えない環境では暗号化ファイル（AES-256-GCM）へフォールバックする。
keyring = "3"
# フォールバックの暗号化ファイル用（AES-256-GCM + 鍵導出）。
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.2"
# カスタムスキーム（novnow://）の受信ハンドラが http::Response を返すために必要。
http = "1"

[features]
# 備考: Tauri v2 では `tauri/custom-protocol` フィーチャーは不要となり無視される
# （本アプリではどこからも有効化していない）。本フィーチャーは定義しない。
