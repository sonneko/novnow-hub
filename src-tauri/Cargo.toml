[package]
name = "novnow-hub"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# セッション情報の暗号化保管（OS の Keychain / Credential Manager / Secret Service）。
# IOTA Stronghold は依存関係が重く、CI の全プラットフォームでコンパイルに失敗した。
# 要件は「Tauri secure storage（OS のキーチェーン）へのセッション保管・平文露出禁止」であり、
# OS のキーチェーンを直接利用する `keyring` クレートで同要件を満たす（判断 15 追記）。
# keyring 3 も依存関係が重いため、API がシンプルで軽量な keyring 2 を採用。
keyring = "2"
# カスタムスキーム（novnow://）の受信ハンドラが http::Response を返すために必要。
http = "1"

[features]
# 備考: Tauri v2 では `tauri/custom-protocol` フィーチャーは不要となり無視される
# （本アプリではどこからも有効化していない）。本フィーチャーは定義しない。
